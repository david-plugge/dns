[package]
name = "dashboard"
version.workspace = true
edition.workspace = true

[dependencies]
api.workspace = true
dioxus = { version = "0.7.10", features = ["web"] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255", version = "0.0.1", default-features = false, features = ["web"] }
futures-util = { version = "0.3", default-features = false }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
serde.workspace = true
serde_json = "1"
serde_urlencoded = "0.7"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Window", "History", "Location", "EventTarget", "HtmlDialogElement"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
