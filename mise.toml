[tools]
"cargo:dioxus-cli" = "0.7.10"
rust = "latest"

# Local development only; the server itself has no default upstreams.
[env]
DNS_LISTEN = "127.0.0.1:5300"
DNS_HTTP_LISTEN = "127.0.0.1:8053"
DNS_PASSWORD = "dev"
DNS_DATABASE = "target/dns.duckdb"
DNS_BLOCKLIST_CACHE_DIR = "target/blocklists"
DNS_BLOCKLISTS = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts,https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt"
DNS_UPSTREAMS = "tls://9.9.9.9#dns.quad9.net,https://1.1.1.1/dns-query#cloudflare-dns.com"
